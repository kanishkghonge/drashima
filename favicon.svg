<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bone shape -->
  <g fill="#667eea">
    <!-- Left end of bone -->
    <circle cx="20" cy="30" r="12"/>
    <circle cx="20" cy="50" r="12"/>
    <circle cx="25" cy="40" r="8"/>
    
    <!-- Middle shaft -->
    <rect x="25" y="35" width="50" height="10" rx="3"/>
    
    <!-- Right end of bone -->
    <circle cx="80" cy="30" r="12"/>
    <circle cx="80" cy="50" r="12"/>
    <circle cx="75" cy="40" r="8"/>
  </g>
</svg>
